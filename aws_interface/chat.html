<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Base Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <style>
    :root {
      --bg:#f5f7fa; --card-bg:#ffffffcc; --accent-bg:#eef2ff;
      --primary:#2563eb; --accent:#7c3aed;
      --text:#111827; --subtext:#4b5563;
      --border:#e5e7eb; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg:#0d1117; --card-bg:#1e2531cc; --accent-bg:#222a35;
      --primary:#60a5fa; --accent:#a78bfa;
      --text:#f3f4f6; --subtext:#9ca3af;
      --border:#374151; --shadow:0 4px 16px rgba(0,0,0,0.5);
    }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg); color:var(--text);
      margin:0; min-height:100vh; display:flex; flex-direction:column;
      transition:background .3s,color .3s;
    }
    header{display:flex;justify-content:center;align-items:center;padding:1rem 0;}
    h1{
      font-family:'Orbitron',sans-serif;font-weight:800;font-size:2.3rem;
      background:linear-gradient(90deg,var(--primary),var(--accent));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .toggle{position:absolute;top:1rem;right:1.5rem;background:none;border:none;
            font-size:1.3rem;color:var(--accent);cursor:pointer;transition:transform .2s;}
    .toggle:hover{transform:rotate(15deg);}

    main{position:relative;display:flex;height:calc(100vh - 80px);width:100%;overflow:hidden;}

    /* --- Sidebar --- */
#sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 260px;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 1rem;
  box-shadow: var(--shadow);
  overflow-y: auto;
  transform: translateX(0);
  transition: transform 0.35s ease;
  z-index: 40;
}

#sidebar.hidden {
  transform: translateX(-100%);
}

/* --- Sidebar toggle --- */
#sidebarToggle {
  position: fixed;
  top: 1.2rem;
  left: 300px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: white;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0,0,0,0.3);
  z-index: 100;                /* always above sidebar */
  transition: left 0.35s ease, transform 0.35s ease;
}

/* Move toggle when sidebar hidden */
#sidebar.hidden ~ #sidebarToggle {
  left: 20px;
}

#sidebar.hidden ~ #sidebarToggle svg {
  transform: rotate(180deg);
}

    #newChatBtn{background:linear-gradient(135deg,var(--accent),var(--primary));color:white;border:none;
      border-radius:8px;padding:0.6rem 0.8rem;cursor:pointer;margin-bottom:0.8rem;font-weight:600;}



    #convoTabs{display:flex;flex-direction:column;gap:0.4rem;overflow-y:auto;}
    .convo-tab{background:var(--accent-bg);color:var(--text);border:1px solid var(--border);
      border-radius:8px;padding:0.5rem 0.7rem;cursor:pointer;display:flex;justify-content:space-between;}
    .convo-tab.active{background:var(--accent);color:white;}
    #chat-area{flex:1;display:flex;flex-direction:column;width:100%;padding:1rem;gap:0.6rem;}
    #chat{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow-y:auto;padding:1.2rem 1.5rem;}
    .user-msg,.assistant-msg{margin:.6rem 0;padding:.8rem 1rem;border-radius:10px;max-width:85%;}
    .user-msg{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;margin-left:auto;text-align:right;}
    .assistant-msg{background:var(--accent-bg);color:var(--text);margin-right:auto;}
    .input-row{display:flex;align-items:center;justify-content:center;background:var(--card-bg);
      border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
      width:100%;padding:.8rem 1rem;gap:.6rem;}
    input[type=text],input[type=number]{background:var(--accent-bg);color:var(--text);
      border:1px solid var(--border);border-radius:8px;padding:.6rem 1rem;font-size:1rem;}
    input[type=text]{flex:1;} input[type=number]{width:60px;text-align:center;}
    button{padding:.6rem 1rem;background:linear-gradient(135deg,var(--accent),var(--primary));
      border:none;border-radius:8px;color:white;font-weight:600;cursor:pointer;}
    button:hover{transform:translateY(-1px);box-shadow:0 0 8px var(--accent);}

    .upload-toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.upload-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: white;
  border: none;
  border-radius: 10px;
  padding: 0.6rem 1rem;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  text-decoration: none;
}

.upload-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.upload-btn:active {
  transform: scale(0.97);
}

.hidden-input {
  display: none;
}


    /* Image selection */
    .figure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-top:1rem;}
    .figure-card{position:relative;background:var(--accent-bg);border:1px solid var(--border);
      border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;height:230px;}
    .figure-card:hover{transform:scale(1.03);box-shadow:0 0 12px var(--accent);}
    .figure-card.selected-image {
      outline: 3px solid var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .user-msg.image-feedback {
      font-style: italic;
      opacity: 0.8;
    }
    .figure-card img{width:100%;height:100%;object-fit:cover;}
    .figure-checkbox{position:absolute;top:8px;left:8px;width:20px;height:20px;z-index:5;cursor:pointer;accent-color:var(--accent);}
    .figure-checkbox:checked{transform:scale(1.2);}
    .figure-overlay{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);
      color:#fff;font-size:.85rem;text-align:center;padding:.3rem;opacity:0;transition:opacity .2s;}
    .figure-card:hover .figure-overlay{opacity:1;}

    /* Modal styles */
    .modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;
      background:rgba(0,0,0,0.85);align-items:center;justify-content:center;}
    .modal.active{display:flex;}
    .modal-content{background:var(--card-bg);border-radius:12px;max-width:800px;max-height:90vh;
      overflow-y:auto;padding:2rem;position:relative;box-shadow:0 0 40px rgba(0,0,0,0.5);}
    .modal-close{position:absolute;top:1rem;right:1rem;font-size:2rem;color:var(--text);
      cursor:pointer;background:none;border:none;padding:0;line-height:1;}
    .modal-close:hover{color:var(--accent);}
    .modal-image{width:100%;max-height:400px;object-fit:contain;border-radius:8px;margin-bottom:1rem;}
    .modal-caption{font-size:1.1rem;font-weight:600;margin-bottom:0.8rem;color:var(--text);}
    .modal-context{font-size:0.95rem;line-height:1.6;color:var(--subtext);}
      #loading {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 0.6rem;
  }

  .loader {
    width: 18px;
    height: 18px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  </style>
</head>
<body>
  <button id="themeToggle" class="toggle" title="Toggle theme">🌙</button>
  <header><h1>Knowledge Base Chat</h1></header>

  <main>
    <aside id="sidebar">
      <button id="newChatBtn">➕ New Chat</button>
      <div id="convoTabs"></div>
    </aside>
    <button id="sidebarToggle" title="Toggle chat list">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
      </svg>
    </button>

    <section id="chat-area">
      <div id="loading">
        <div class="loader"></div>
        <span>Thinking...</span>
      </div>      
      <div id="chat"></div>
      <div class="input-row">
        <select id="modelSelect" class="model-select">
          <option>Claude Sonnet 4</option>
          <option>Claude Sonnet 4.5</option>
          <option>Claude Haiku 4.5</option>
          <option>Claude Opus 4</option>
          <option>Claude Opus 4.1</option>
          <option>Claude 3.7 Sonnet</option>
          <option>Claude 3.5 Sonnet v2</option>
          <option>Claude 3.5 Haiku</option>
          <option>Claude 3 Haiku</option>
          <option>Nova Premier</option>
          <option>Nova Pro</option>
          <option>Nova Lite</option>
          <option>Nova Micro</option>
          <option>Llama 3.1 8B</option>
          <option>Llama 3.1 70B</option>
          <option>Llama 3.1 405B</option>
          <option>Llama 3.2 1B</option>
          <option>Llama 3.2 3B</option>
          <option>Llama 3.2 11B</option>
          <option>Llama 3.2 90B</option>
          <option>Llama 3.3 70B</option>
          <option>Llama 4 Scout 17B</option>
          <option>Llama 4 Maverick 17B</option>
          <option>DeepSeek R1</option>
        </select>
        <input type="text" id="question" placeholder="Ask your question..." />
        <input type="number" id="imgLimit" min="1" max="20" value="8" />
        <button onclick="sendMessage()">Send</button>
      </div>
      

      <div class="upload-toolbar">
        <label for="permFileInput" class="upload-btn">📁 Permanent Upload</label>
        <input id="permFileInput" type="file" accept="application/pdf" onchange="uploadFile('perm')" hidden />
      
        <button class="upload-btn" onclick="triggerS3Push()">☁️ S3 Push</button>
        <button class="upload-btn" onclick="triggerResync()">🧠 Resync KB</button>
      
        <label for="tempFileInput" class="upload-btn">📄 Temporary Upload</label>
        <input id="tempFileInput" type="file" accept="application/pdf" onchange="uploadFile('temp')" hidden />
        <button class="upload-btn" onclick="openBatchUpload()">📦 Batch Upload Page</button>
      </div>
      

    </section>
  </main>

  <!-- Modal -->
  <div id="imageModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modalImage" class="modal-image" src="" alt="Figure">
      <div id="modalCaption" class="modal-caption"></div>
      <div id="modalContext" class="modal-context"></div>
    </div>
  </div>

  <script>
    const html=document.documentElement;
    const toggleBtn=document.getElementById('themeToggle');
    const savedTheme=localStorage.getItem('theme');
    if(savedTheme==='dark'){html.setAttribute('data-theme','dark');toggleBtn.textContent='☀';}
    toggleBtn.onclick=()=>{
      if(html.getAttribute('data-theme')==='dark'){
        html.removeAttribute('data-theme');toggleBtn.textContent='🌙';localStorage.setItem('theme','light');
      } else {
        html.setAttribute('data-theme','dark');toggleBtn.textContent='☀';localStorage.setItem('theme','dark');
      }
    };
  
    const sidebar=document.getElementById('sidebar');
    const sidebarToggle=document.getElementById('sidebarToggle');
    sidebarToggle.onclick=()=>{sidebar.classList.toggle('hidden');};
  
    let conversations={}, activeSession=null, sessionId=null;
    let selectedImages = [], lastMessageUsedImages = false;
  
    function saveToLocal(){
      localStorage.setItem("conversations", JSON.stringify(conversations));
      localStorage.setItem("activeSession", activeSession);
    }
  
    function loadFromLocal(){
      const saved=localStorage.getItem("conversations");
      if(saved){
        conversations=JSON.parse(saved);
        Object.keys(conversations).forEach((sid,i)=>addConversationTab(sid,"Chat "+(i+1)));
      }
      const last=localStorage.getItem("activeSession");
      if(last && conversations[last]) switchConversation(last);
    }
  
    function addConversationTab(sid,title){
      const div=document.createElement("div");
      div.className="convo-tab";div.dataset.sid=sid;
      div.innerHTML=`<span>${title}</span><button class="delete-tab">🗑</button>`;
      div.querySelector(".delete-tab").onclick=(e)=>{e.stopPropagation();deleteConversation(sid);};
      div.onclick=()=>switchConversation(sid);
      document.getElementById("convoTabs").appendChild(div);
    }

    if (!('crypto' in window)) window.crypto = {};
    if (!window.crypto.randomUUID) {
      window.crypto.randomUUID = function () {
        // Simple UUID v4 polyfill
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };
    }
  
    function updateActiveTab(){
      document.querySelectorAll(".convo-tab").forEach(t=>t.classList.toggle("active",t.dataset.sid===activeSession));
    }
  
    function newConversation(){
      const id=crypto.randomUUID();
      conversations[id]="";
      addConversationTab(id,"Chat "+Object.keys(conversations).length);
      switchConversation(id);
      saveToLocal();
    }
  
    function switchConversation(id){
      activeSession=id;sessionId=id;
      document.getElementById("chat").innerHTML=conversations[id]||"";
      updateActiveTab();saveToLocal();
    }
  
    function deleteConversation(id){
      if(!confirm("Delete this conversation?"))return;
      delete conversations[id];
      document.querySelector(`.convo-tab[data-sid='${id}']`)?.remove();
      if(activeSession===id){
        const keys=Object.keys(conversations);
        if(keys.length)switchConversation(keys[0]);
        else{activeSession=null;sessionId=null;document.getElementById("chat").innerHTML="";}
      }
      saveToLocal();
    }
  
    document.getElementById("newChatBtn").onclick=newConversation;
  
    // ---------- Modal ----------
    function openModal(imgUrl, caption, context) {
      document.getElementById('modalImage').src = imgUrl;
      document.getElementById('modalCaption').textContent = caption || 'No caption available';
      document.getElementById('modalContext').textContent = context || 'No context available';
      document.getElementById('imageModal').classList.add('active');
    }
    function closeModal(event) {
      if (!event || event.target.id === 'imageModal' || event.target.classList.contains('modal-close')) {
        document.getElementById('imageModal').classList.remove('active');
      }
    }
  
    // ---------- Messaging ----------
    async function sendMessage() {
      const q=document.getElementById("question").value.trim();
      const imgLimit=parseInt(document.getElementById("imgLimit").value)||8;
      if(!q) return;
  
      const chatBox=document.getElementById("chat");
      chatBox.innerHTML += `<div class='user-msg'><strong>You:</strong> ${q}</div>`;
      conversations[activeSession] = chatBox.innerHTML;
      saveToLocal();
  
      if(selectedImages.length>0){
        const count=selectedImages.length;
        chatBox.innerHTML += `<div class='user-msg image-feedback'>🔎 Sent ${count} image${count>1?"s":""}</div>`;
        lastMessageUsedImages=true;
      } else lastMessageUsedImages=false;
  
      document.getElementById("question").value="";
      chatBox.scrollTop=chatBox.scrollHeight;
      saveToLocal();

      const loading = document.getElementById("loading");
      loading.style.display = "flex";

      const modelName = document.getElementById("modelSelect").value;


      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
          question: q,
          image_limit: imgLimit,
          session_id: sessionId,
          selected_images: selectedImages,
          model_name: modelName
        })
        });

        const data = await res.json();
        if (!sessionId && data.session_id) sessionId = data.session_id;

        let msgHtml = `<div class='assistant-msg'><strong>Assistant:</strong> ${data.answer || "(no response)"}`;

        // ---- FIGURES ----
        if (!lastMessageUsedImages) {
          const imgs = (data.documents || []).filter(d => d.mime_type && d.mime_type.startsWith("image/"));
          if (imgs.length > 0) {
            msgHtml += "<div><h4 style='margin-top:0.8rem;'>Figures:</h4><div class='figure-grid'>";
            for (const img of imgs) {
              const caption = (img.caption || "No caption").replace(/'/g,"&#39;").replace(/"/g,"&quot;");
              const context = (img.context || "No context available")
                .replace(/'/g,"&#39;").replace(/"/g,"&quot;").replace(/\n+/g," ");
              const source = img.source || "";
              const id = crypto.randomUUID();
              msgHtml += `
                <div class='figure-card'>
                  <input type='checkbox' id='chk-${id}' class='figure-checkbox'
                    onchange='toggleImageSelect(this, "${img.url}", \`${caption}\`, \`${context}\`, "${source}")' />
                  <img src='${img.url}' alt='Figure' onclick='openModal("${img.url}", \`${caption}\`, \`${context}\`)' />
                  <div class='figure-overlay'>Click to view details</div>`;
              // ---- OPTIONAL RELEVANCE FOR IMAGES ----
              if (img.relevance !== undefined && img.relevance !== null) {
                msgHtml += `<div style="font-size:0.85rem;color:var(--subtext);text-align:center;margin-top:0.3rem;">
                  Relevance: ${img.relevance.toFixed(3)}
                </div>`;
              }
              msgHtml += `</div>`;
            }
            msgHtml += "</div></div>";
          }
        }

        // ---- PDF REFERENCES ----
        if (data.pdfs && data.pdfs.length > 0) {
          msgHtml += "<div style='margin-top:0.6rem;'><h4>PDFs:</h4>";
          for (const pdf of data.pdfs) {
            const name = pdf.display_name || "View PDF";
            const score = pdf.relevance !== undefined && pdf.relevance !== null
              ? ` <span style="color:var(--subtext);font-size:0.85rem;">(score: ${pdf.relevance.toFixed(3)})</span>`
              : "";
            msgHtml += `<div style='margin:0.3rem 0;'>
              <a href='${pdf.url}' target='_blank'
                style='display:inline-block;padding:0.4rem 0.7rem;
                background:var(--accent);color:white;border-radius:6px;
                font-size:0.9rem;text-decoration:none;'>📄 ${name}</a>${score}
              </div>`;
          }
          msgHtml += "</div>";
        }

        // ---- END MESSAGE ----
        msgHtml += "</div>";

        chatBox.innerHTML += msgHtml;
        chatBox.scrollTop = chatBox.scrollHeight;

        selectedImages = [];
        document.querySelectorAll(".figure-checkbox").forEach(c => (c.checked = false));

        conversations[activeSession] = chatBox.innerHTML;
        saveToLocal();

      } catch (err) {
        chatBox.innerHTML += `<div class='assistant-msg' style='color:#f87171;'>Network error: ${err}</div>`;
        conversations[activeSession] = chatBox.innerHTML;
        saveToLocal();

      } finally {
        loading.style.display = "none";   
      }

      
    }
  
    function toggleImageSelect(box,url,caption,context,source){
      if(box.checked){
        selectedImages.push({url,caption,context,source});
        box.parentElement.classList.add("selected-image");
      } else {
        selectedImages=selectedImages.filter(img=>img.url!==url);
        box.parentElement.classList.remove("selected-image");
      }
      saveToLocal();
    }
  
    async function uploadFile(type){
      const fileInput=document.getElementById(type==='perm'?'permFileInput':'tempFileInput');
      const file=fileInput.files[0]; if(!file)return;
      const uploading=document.getElementById("uploading"); uploading.style.display="flex";
      const form=new FormData(); form.append("file",file);
      if(type==="temp")form.append("session_id",sessionId||"");
      const endpoint=type==="perm"?"/upload_permanent":"/upload_temporary";
      try{await fetch(endpoint,{method:"POST",body:form});
        alert(`${type==='perm'?'Permanent':'Temporary'} upload successful`);
      }catch(err){alert("Upload failed: "+err);}finally{uploading.style.display="none";}
    }

    async function triggerS3Push(){
      if(!confirm("Run S3 push now? This will delete local chunked files after upload.")) return;
      document.getElementById("uploading").style.display="flex";
      try{
        const res=await fetch("/s3_push",{method:"POST"});
        const data=await res.json();
        alert(data.message || "S3 push completed.");
      }catch(err){
        alert("S3 push failed: " + err);
      }finally{
        document.getElementById("uploading").style.display="none";
      }
    }

    function openBatchUpload() {
    window.location.href = "/batch_upload";
    }

    

    async function triggerResync(){
      if(!confirm("⚠️ Attention: The chatbot will be down for ~10 minutes while the KB re-syncs. Proceed?")) return;
      document.getElementById("uploading").style.display="flex";
      try{
        const res=await fetch("/resync_kb",{method:"POST"});
        const data=await res.json();
        alert(data.message || "Knowledge base resync started.");
      }catch(err){
        alert("Resync failed: " + err);
      }finally{
        document.getElementById("uploading").style.display="none";
      }
    }
    // Initialize
    loadFromLocal();
  </script>
  
</body>
</html>
